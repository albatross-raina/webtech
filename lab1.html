<!DOCTYPE HTML>
<html>

<head>

    <style>
        table {
            border: 1px solid black;
            border-collapse: collapse;
        }

        th {
            border: 1px solid black;
            padding: 15px;
        }

        td {
            border: 1px solid black;
            padding: 15px;
        }
    </style>

</head>

<body>

    <h2>First Table</h2>

    <table>

        <tr>
            <th>Name</th>
            <th>ID</th>
            <th></th>
        </tr>

        <tr>
            <td>F</td>
            <td>10</td>
            <td rowspan="2">ISD</td>
        </tr>

        <tr>
            <td>B</td>
            <td>11</td>
        </tr>

    </table>


    <br><br>


    <h2>Second Table</h2>

    <table>

        <tr>
            <th>AB</th>
            <th>BC</th>
            <th>CD</th>
            <th>DE</th>
        </tr>

        <tr>
            <td rowspan="4">EF<br><br>ZX</td>
            <td colspan="3">GH</td>
        </tr>

        <tr>
            <td colspan="3">IJ</td>
        </tr>

        <tr>
            <td rowspan="2">KL</td>
            <td>MN</td>
            <td rowspan="2">OP</td>
        </tr>

        <tr>
            <td>NO</td>
        </tr>

    </table>

</body>

</html>
